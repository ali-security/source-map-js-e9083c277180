name: seal-build

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.19.0
      - name: Pack
        run: |
          node --version
          npm --version
          npm pack
          ls -l source-map-js-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: source-map-js-tgz
          path: source-map-js-*.tgz
